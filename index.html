<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Happy Birthday Marc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Caveat:wght@700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* VOICE: cheeky, surprise-party, a gift unwrapped in the dark
   IDEA: a real greeting card in a velvet-black room: scratch, envelope, pop-up
   PICTURE: scratch card -> white envelope -> card -> jack-in-the-box Marc with two 4s
   COLOUR and TYPE: black stage, envelope white, card teal with gold 4s and red box; Fredoka + Caveat
   LAYOUT: one centred object at a time, nothing else on screen */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;color:#fff;overflow:hidden;font-family:Fredoka,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
.stage{position:fixed;inset:0;display:grid;place-items:center}
.hint{position:fixed;left:0;right:0;bottom:max(7vh,24px);text-align:center;font-size:17px;color:#cfc7ff;opacity:0;transition:opacity .6s}
.hint.on{opacity:1;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* scratch + envelope */
#envWrap{position:relative;width:310px;height:210px;transform:translateY(110vh);transition:transform 1.4s cubic-bezier(.2,.9,.25,1)}
#envWrap.up{transform:translateY(0)}
#envWrap.gone{transform:translateY(120vh);transition:transform .9s cubic-bezier(.6,0,.8,.4)}
.env{position:absolute;inset:0;perspective:900px}
.back{position:absolute;inset:0;background:#efe9e1;border-radius:8px}
.letter{position:absolute;z-index:1;left:16px;right:16px;top:12px;height:180px;display:flex;justify-content:center;padding-top:30px;transition:transform 1s cubic-bezier(.3,1.3,.5,1) .5s;filter:drop-shadow(0 4px 6px #0008)}
.open .letter{transform:translateY(-140px)}
.letter span{font:500 16px Fredoka,sans-serif;color:#d9fffb}
.letter svg{animation:glint 1.4s ease-in-out infinite}
@keyframes glint{50%{transform:rotate(-12deg) scale(1.1)}}
.pocket{position:absolute;z-index:2;inset:0;background:#fff;border-radius:8px;clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);box-shadow:inset 0 -2px 0 #0001}
.pocket::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 48%,#0000000d 49%,transparent 52%),linear-gradient(200deg,transparent 48%,#0000000d 49%,transparent 52%)}
.flap{position:absolute;left:0;right:0;top:0;height:128px;background:#f7f4ef;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s ease,z-index 0s .3s;z-index:3;filter:drop-shadow(0 2px 2px #0002)}
.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:104px;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a7a,#c4162b);z-index:4;display:grid;place-items:center;font-size:20px;color:#fff;box-shadow:0 2px 6px #0005;transition:opacity .3s}
.open .seal{opacity:0}
.tap{position:absolute;left:50%;bottom:-62px;transform:translateX(-50%);background:#ffd75e;color:#1b1b1b;font-weight:700;font-size:18px;padding:10px 22px;border-radius:30px;border:0;opacity:0;pointer-events:none;transition:opacity .4s;white-space:nowrap;font-family:inherit}
.tap.on{opacity:1;pointer-events:auto;animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{transform:translateX(-50%) translateY(-6px)}}
#scratch{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);border-radius:12px;z-index:10;transition:opacity .7s;touch-action:none;cursor:pointer}

/* card */
#cardWrap{position:absolute;width:300px;height:470px;perspective:1400px;opacity:0;transform:scale(.4) translateY(40px);pointer-events:none;transition:opacity .6s,transform .9s cubic-bezier(.3,1.4,.5,1)}
#cardWrap.show{opacity:1;transform:none;pointer-events:auto}
.inside{position:absolute;inset:0;border-radius:10px;background:radial-gradient(120% 80% at 50% 10%,#17847f,#0a4b48);overflow:hidden;box-shadow:0 20px 60px #0009}
.door{position:absolute;inset:0;border-radius:10px 10px 4px 4px;transform-origin:left center;transition:transform 1.5s cubic-bezier(.5,0,.2,1);z-index:5;background:linear-gradient(90deg,#4a2116,#7a3a28 45%,#5a2a1e);box-shadow:0 20px 60px #0009,inset 0 0 0 6px #3a180f;cursor:pointer}
.scribble{position:absolute;left:24px;right:24px;top:60px;z-index:2;transform:rotate(-7deg);font-family:"Permanent Marker",cursive;color:#fff;font-size:44px;line-height:1.15;text-align:center;pointer-events:none}
.scribble span{display:block;clip-path:inset(0 100% 0 0)}
.scribble span:nth-child(2){font-size:54px;color:#ffe14d;transform:rotate(3deg)}
.scribble span:nth-child(3){font-size:62px}
.write .scribble span{animation:ink .9s steps(14) forwards}
.write .scribble span:nth-child(2){animation-delay:1.05s}
.write .scribble span:nth-child(3){animation-delay:2.1s;animation-duration:.6s}
@keyframes ink{to{clip-path:inset(0 0 0 0)}}
.door.open{transform:rotateY(-108deg);pointer-events:none}
.door::before,.door::after{content:"";position:absolute;left:30px;right:30px;border:6px solid #0000002e;border-radius:6px}
.door::before{top:34px;height:170px}.door::after{top:236px;bottom:34px}
.plate{position:absolute;left:50%;top:96px;transform:translateX(-50%);background:linear-gradient(#ffe48a,#d9a520);color:#4a2116;border-radius:6px;padding:6px 16px;font:700 18px Fredoka,sans-serif;white-space:nowrap;box-shadow:0 3px 0 #9a7012;z-index:1}
.knob{position:absolute;right:30px;top:244px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#d9a520 60%,#8a6410);box-shadow:0 3px 6px #0007;z-index:1}
.keyhole{position:absolute;right:37px;top:282px;width:10px;height:18px;background:#120604;border-radius:5px 5px 2px 2px;z-index:1}
.key{position:absolute;left:254px;top:276px;width:84px;z-index:8;transform-origin:4px 17px;opacity:0;transform:translate(-150px,-320px) rotate(-25deg) scale(1.8);transition:transform 1.1s cubic-bezier(.3,1.2,.5,1),opacity .4s;pointer-events:none;filter:drop-shadow(0 3px 4px #0008)}
.key.in{opacity:1;transform:none}
.key.turn{opacity:1;transform:rotateX(70deg) rotate(0);transition:transform .5s}
.key.out{opacity:0;transition:opacity .4s}
.box,.lid{cursor:pointer}
.box.ready{animation:shake 1.2s ease-in-out infinite}
@keyframes shake{0%,70%,100%{transform:none}75%{transform:rotate(-3deg)}85%{transform:rotate(3deg)}}
.big{font-size:120px;font-weight:700;color:#ffd75e;line-height:1;text-shadow:0 6px 0 #c08a10}
.lyric{position:absolute;top:14px;left:12px;right:12px;text-align:center;font-family:Caveat,cursive;font-size:34px;line-height:1.05;min-height:76px;color:#fff;text-shadow:0 2px 6px #0007}
.lyric span{display:inline-block;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.box{position:absolute;left:50%;bottom:22px;width:190px;height:92px;margin-left:-95px;background:linear-gradient(90deg,#d61f3a,#f03a54 50%,#d61f3a);border-radius:6px;z-index:3;box-shadow:inset 0 -8px 0 #0002}
.box::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:#ffd75e}
.lid{position:absolute;left:50%;bottom:110px;width:206px;height:24px;margin-left:-103px;background:#f03a54;border-radius:5px;z-index:4;transform-origin:left bottom;box-shadow:inset 0 -5px 0 #0002}
.lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:26px;margin-left:-13px;background:#ffd75e}
.go .lid{animation:lid .55s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes lid{to{transform:translate(-40px,-20px) rotate(-110deg)}}
.jack{position:absolute;left:50%;bottom:44px;width:150px;margin-left:-75px;z-index:2;transform:translateY(380px);display:flex;flex-direction:column;align-items:center}
.go .jack{animation:boing 1s cubic-bezier(.25,1.7,.45,1) .05s forwards}
@keyframes boing{to{transform:translateY(0)}}
.head{position:relative;width:104px;height:152px;z-index:2;transform-origin:50% 95%;animation:bob 1.1s ease-in-out infinite}
.head img{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 6px #0006)}
.hat{position:absolute;left:28px;top:-46px;width:52px;height:62px;transform:rotate(-12deg)}
@keyframes bob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.body{width:120px;height:96px;margin-top:-14px;display:block}
.arm{transform-origin:60px 24px;animation:wave .5s ease-in-out infinite alternate}
.arm.r{transform-origin:60px 24px;animation-delay:-.25s}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(14deg)}}
.spring{width:40px;height:90px;display:block;margin-top:-4px}
.jack .spring{height:60px}
.four{position:absolute;bottom:60px;width:90px;z-index:1;display:flex;flex-direction:column;align-items:center;transform:translateY(260px)}
.four.l{left:-8px}.four.r{right:-8px}
.four .big{animation:wob 1.3s ease-in-out infinite}
.four.r .big{animation-delay:-.65s}
@keyframes wob{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg) translateY(-6px)}}
.go .four.l{animation:boingL 1s cubic-bezier(.25,1.7,.45,1) .3s forwards}
.go .four.r{animation:boingR 1s cubic-bezier(.25,1.7,.45,1) .45s forwards}
@keyframes boingL{to{transform:translateY(-70px) rotate(-8deg)}}
@keyframes boingR{to{transform:translateY(-70px) rotate(8deg)}}
.hide .jack{animation:downJ .7s cubic-bezier(.5,-.4,.8,.6) forwards}
.hide .four.l{animation:downL .7s cubic-bezier(.5,-.4,.8,.6) .1s forwards}
.hide .four.r{animation:downR .7s cubic-bezier(.5,-.4,.8,.6) .2s forwards}
.hide .lid{animation:lidBack .5s ease-in .7s both}
@keyframes downJ{from{transform:translateY(0)}to{transform:translateY(380px)}}
@keyframes downL{from{transform:translateY(-70px) rotate(-8deg)}to{transform:translateY(260px)}}
@keyframes downR{from{transform:translateY(-70px) rotate(8deg)}to{transform:translateY(260px)}}
@keyframes lidBack{from{transform:translate(-40px,-20px) rotate(-110deg)}to{transform:none}}
.again{position:absolute;right:12px;bottom:-60px;left:12px;margin:auto;width:max-content;background:#ffd75e;color:#1b1b1b;border:0;border-radius:30px;padding:11px 22px;font:700 17px Fredoka,sans-serif;opacity:0;transition:opacity .5s;pointer-events:none}
.again.on{opacity:1;pointer-events:auto}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media(max-height:640px){#cardWrap{transform-origin:center;scale:.86}}
@media(prefers-reduced-motion:reduce){.head,.four .big,.arm{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <div id="envWrap">
    <div class="env" id="env">
      <div class="back"></div>
      <div class="letter"><svg viewBox="0 0 84 34" width="150"><circle cx="66" cy="17" r="14" fill="none" stroke="#ffd75e" stroke-width="7"/><path d="M52 17 H4" stroke="#ffd75e" stroke-width="7" stroke-linecap="round"/><path d="M10 17 v10 M20 17 v8" stroke="#ffd75e" stroke-width="6" stroke-linecap="round"/></svg></div>
      <div class="pocket"></div>
      <div class="flap"></div>
      <div class="seal">♥</div>
    </div>
    <canvas id="scratch"></canvas>
    <button class="tap" id="tap">Tap here 👆</button>
  </div>

  <div id="cardWrap">
    <div class="inside" id="inside">
      <div class="lyric" id="lyric"></div>

/* sound effects, all synthesised */
let nbuf=null;
function noise(){if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}const n=ac.createBufferSource();n.buffer=nbuf;return n;}
function burstN(t,dur,type,freq,q,vol){const n=noise(),f=ac.createBiquadFilter(),g=ac.createGain();f.type=type;f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(f).connect(g).connect(ac.destination);n.start(t,Math.random()*.5);n.stop(t+dur+.02);}
let lastScr=0;
function sScratch(){if(!ac)return;const t=ac.currentTime;if(t-lastScr<.13)return;lastScr=t;
  for(let i=0;i<5;i++)burstN(t+i*.014,.03,'bandpass',1400+Math.random()*1800,.9,.9);
  burstN(t,.09,'highpass',4000,.7,.35);}
function sKnock(){if(!ac)return;const t=ac.currentTime;
  [0,.24].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(210,t+d);o.frequency.exponentialRampToValueAtTime(110,t+d+.1);
    g.gain.setValueAtTime(.9,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.18);
    burstN(t+d,.07,'bandpass',900,1.5,.8);});}
function sUnlock(){if(!ac)return;const t=ac.currentTime;
  burstN(t,.05,'highpass',3500,1,.5);burstN(t+.18,.04,'bandpass',2400,4,.6);
  const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(180,t+.32);o.frequency.exponentialRampToValueAtTime(90,t+.42);
  g.gain.setValueAtTime(.18,t+.32);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g).connect(ac.destination);o.start(t+.32);o.stop(t+.47);
  burstN(t+.32,.1,'bandpass',1200,3,.5);}
function sCreak(dur=1.4){if(!ac)return;const t=ac.currentTime;
  const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain(),lfo=ac.createOscillator(),lg=ac.createGain(),am=ac.createGain();
  o.type='sawtooth';o.frequency.setValueAtTime(95,t);
  for(let i=1;i<=8;i++)o.frequency.linearRampToValueAtTime(80+Math.random()*90,t+dur*i/8);
  f.type='bandpass';f.frequency.value=950;f.Q.value=6;
  lfo.frequency.value=28;lg.gain.value=.5;am.gain.value=.5;lfo.connect(lg).connect(am.gain);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.15);g.gain.setValueAtTime(.45,t+dur-.3);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(f).connect(am).connect(g).connect(ac.destination);o.start(t);lfo.start(t);o.stop(t+dur);lfo.stop(t+dur);}
function sThud(delay=0){if(!ac)return;const t=ac.currentTime+delay;
  burstN(t,.5,'lowpass',260,.7,1);burstN(t,.12,'bandpass',1500,1,.7);burstN(t+.06,.25,'bandpass',3200,6,.18);
  const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(40,t+.3);
  g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.55);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.57);
  burstN(t,.18,'lowpass',500,1,.8);burstN(t+.02,.05,'bandpass',2000,2,.25);}
function sSqueak(delay,dur){if(!ac)return;const t=ac.currentTime+delay;let x=0;
  while(x<dur){const d=.08+Math.random()*.16,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';
    o.frequency.setValueAtTime(1700+Math.random()*900,t+x);o.frequency.linearRampToValueAtTime(1500+Math.random()*1300,t+x+d);
    g.gain.setValueAtTime(0,t+x);g.gain.linearRampToValueAtTime(.12,t+x+.02);g.gain.linearRampToValueAtTime(0,t+x+d);
    o.connect(g).connect(ac.destination);o.start(t+x);o.stop(t+x+d+.02);x+=d+.03+Math.random()*.05;}}
function sBoing(delay=0){if(!ac)return;const t=ac.currentTime+delay;
  const o=ac.createOscillator(),g=ac.createGain(),v=ac.createOscillator(),vg=ac.createGain();o.type='sine';
  o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(420,t+.35);v.frequency.value=14;vg.gain.value=40;v.connect(vg).connect(o.frequency);
  g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g).connect(ac.destination);o.start(t);v.start(t);o.stop(t+.62);v.stop(t+.62);}

/* --- scratch layer --- */
const ctx=cv.getContext('2d');let dpr=1,done=false,drawing=false,last=null,moves=0;
function paint(){
  dpr=window.devicePixelRatio||1;const w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#b9b9c4');g.addColorStop(.35,'#f2f2f7');g.addColorStop(.55,'#a7a7b3');g.addColorStop(1,'#e4e4ec');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect?ctx.roundRect(0,0,w,h,12):ctx.rect(0,0,w,h);ctx.fill();
  for(let i=0;i<70;i++){ctx.fillStyle=`rgba(255,255,255,${Math.random()*.7})`;ctx.fillRect(Math.random()*w,Math.random()*h,2,2);}
  ctx.fillStyle='#55556a';ctx.textAlign='center';ctx.font='700 30px Fredoka, sans-serif';
  ctx.fillText('SCRATCH ME',w/2,h/2-4);ctx.font='500 17px Fredoka, sans-serif';ctx.fillText('something is hiding under here…',w/2,h/2+26);
}
function pos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
function scratch(p){
  ctx.globalCompositeOperation='destination-out';ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=46;
  ctx.beginPath();ctx.moveTo((last||p).x,(last||p).y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke();last=p;sScratch();
  if(++moves%8===0)check();
}
function check(){
  const d=ctx.getImageData(0,0,cv.width,cv.height).data;let clear=0,n=0;
  for(let i=3;i<d.length;i+=64){n++;if(d[i]<40)clear++;}
  if(clear/n>.5)reveal();
}
function reveal(){
  if(done)return;done=true;cv.style.opacity=0;cv.style.pointerEvents='none';hint.classList.remove('on');
  setTimeout(()=>{cv.remove();tap.classList.add('on');},700);
}
const start=e=>{if(done)return;e.preventDefault();unlock();drawing=true;last=null;scratch(pos(e));};
const move=e=>{if(!drawing||done)return;e.preventDefault();scratch(pos(e));};
const end=()=>{if(drawing)unlock();drawing=false;last=null;};
cv.addEventListener('pointerdown',start);cv.addEventListener('pointermove',move);
window.addEventListener('pointerup',end);cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});

/* intro: black, then card rises */
let started=false;
const begin=()=>{if(started)return;started=true;unlock();hint.classList.remove('on');
  setTimeout(()=>envWrap.classList.add('up'),300);setTimeout(()=>{hint.innerHTML='Scratch the card ✨';hint.classList.add('on');},1700);};
const go=()=>{paint();setTimeout(()=>hint.classList.add('on'),600);
  ['click','touchend'].forEach(ev=>document.addEventListener(ev,begin,{once:false}));};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(go);

/* envelope -> key -> door -> box */
let stage='env';
function say(t){hint.innerHTML=t;hint.classList.add('on');}
tap.addEventListener('click',()=>{
  unlock();tap.classList.remove('on');
  if(stage==='env'){
    stage='letter';sKnock();env.classList.add('open');
    setTimeout(()=>{tap.textContent='Take the key 🗝️';tap.classList.add('on');},1700);
  }else if(stage==='letter'){
    stage='door';envWrap.classList.add('gone');
    setTimeout(()=>{cardWrap.classList.add('show');},500);
    setTimeout(()=>{key.classList.add('in');},1100);
    setTimeout(()=>say('Now open the door 🚪'),2300);
  }
});
door.addEventListener('click',()=>{
  if(stage==='closed'){reopen();return;}
  if(stage!=='door')return;unlock();stage='opening';hint.classList.remove('on');
  key.classList.add('turn');sUnlock();
  setTimeout(()=>{door.classList.add('open');key.classList.add('out');sCreak();},650);
  setTimeout(()=>{stage='box';box.classList.add('ready');say('Tap the box 🎁');},1500);
});
function reopen(){
  if(stage!=='closed')return;unlock();stage='opening';again.classList.remove('on');hint.classList.remove('on');
  door.classList.remove('write');door.classList.add('open');sCreak();
  setTimeout(()=>{stage='box';pop();},1500);
}
function pop(){
  if(stage!=='box')return;unlock();stage='play';hint.classList.remove('on');box.classList.remove('ready');
  again.classList.remove('on');inside.classList.remove('go','hide');void inside.offsetWidth;
  inside.classList.add('go');sBoing(.05);sBoing(.3);sBoing(.45);burst();sing();
}
box.addEventListener('click',pop);lid.addEventListener('click',pop);
again.addEventListener('click',()=>{if(stage==='closed')reopen();else pop();});

/* song */
const F={G4:392,A4:440,B4:493.88,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
const lines=[
  ['Happy birthday to you',[['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2]]],
  ['Happy birthday to you',[['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2]]],
  ['Happy birthday dear Wilson 🎉',[['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2]]],
  ['Happy birthday to youuuu! 🎂',[['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',3]]]
];
let timers=[];
function note(f,t,d){
  if(!ac)return;
  const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.28,t+.02);g.gain.exponentialRampToValueAtTime(.08,t+d*.7);g.gain.linearRampToValueAtTime(0,t+d*.95);
  const g2=ac.createGain();g2.gain.value=.25;o2.connect(g2).connect(g);
  o.connect(g).connect(ac.destination);o.start(t);o2.start(t);o.stop(t+d);o2.stop(t+d);
}
function sing(){
  timers.forEach(clearTimeout);timers=[];lyric.innerHTML='';
  const lead=.9,beat=.45,t0=(ac?ac.currentTime:0)+lead;let t=0;
  lines.forEach(([words,notes])=>{
    const at=t;
    timers.push(setTimeout(()=>{lyric.innerHTML=`<span>${words}</span>`;},(lead+at)*1000));
    notes.forEach(([n,b])=>{note(F[n],t0+t,b*beat);t+=b*beat;});
    t+=beat*.25;
  });
  timers.push(setTimeout(()=>{lyric.innerHTML='<span>Happy 44th, Marc! 🥳</span>';burst();},(lead+t+.3)*1000));
  timers.push(setTimeout(()=>{inside.classList.remove('go');inside.classList.add('hide');},(lead+t+2.6)*1000));
  timers.push(setTimeout(()=>{door.classList.remove('open');sCreak(1.1);sThud(1.2);},(lead+t+4.2)*1000));
  timers.push(setTimeout(()=>{door.classList.add('write');sSqueak(0,.9);sSqueak(1.05,.9);sSqueak(2.1,.6);},(lead+t+6)*1000));
  timers.push(setTimeout(()=>{stage='closed';again.classList.add('on');},(lead+t+9)*1000));
}

/* confetti */
const cc=$('confetti'),cx=cc.getContext('2d');let parts=[],raf=null;
function size(){cc.width=innerWidth*dpr;cc.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',size);
function burst(){
  size();const cols=['#ffd75e','#f03a54','#7ee0d6','#ffffff','#c9a7ff','#ff9f43'];
  for(let i=0;i<160;i++)parts.push({x:innerWidth/2,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-4,r:Math.random()*6+4,c:cols[i%cols.length],a:Math.random()*6,va:(Math.random()-.5)*.3,life:0});
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life++;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore();});
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<400);
  raf=parts.length?requestAnimationFrame(loop):null;
}
}
